# Generated by generate.mjs — do not edit by hand.
# Change sync.config.json (or the opencode config) and re-run `node generate.mjs`.
# Source: /home/sal/.config/opencode/opencode.jsonc
# DSH-side policy (exclusions, forced-disable, failOnStartupError, extras)
# lives in sync.config.json. Further enable/disable overrides belong in
# $DSH_HOME/profiles/<name>/cordis.patch.yml.
- insert:
  # asana: opencode uses OAuth; dsh-mcp-client has no OAuth support
  - id: mcp-asana
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: asana
      transport: streamable-http
      url: https://mcp.asana.com/v2/mcp

  - id: mcp-chrome-devtools
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: chrome-devtools
      transport: stdio
      command: npx
      args: ['-y', chrome-devtools-mcp@1.11.0, '--autoConnect', '--no-usage-statistics', '--no-performance-crux']

  - id: mcp-context7
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: context7
      transport: streamable-http
      url: https://mcp.context7.com/mcp
      headers:
        Authorization: !!js '`Bearer ${process.env.CONTEXT7_API_KEY || ""}`'
      failOnStartupError: true

  # freecad: opencode has enabled: false
  - id: mcp-freecad
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: freecad
      transport: stdio
      command: !!js '`${process.env.HOME}/miniconda3/bin/freecad-mcp`'
      cwd: /tmp/opencode
      env:
        FREECAD_MODE: xmlrpc
        FREECAD_SOCKET_HOST: localhost
        FREECAD_XMLRPC_PORT: '9875'

  # postman: deliberate: kept disabled until reviewed
  - id: mcp-postman
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: postman
      transport: streamable-http
      url: https://mcp.postman.com/minimal

  # sendgrid: deliberate: kept disabled until reviewed
  - id: mcp-sendgrid
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: sendgrid
      transport: stdio
      command: npx
      args: ['-y', sendgrid-mcp]
      env:
        SENDGRID_API_KEY: !!js (process.env.SENDGRID_API_KEY || "")
        READ_ONLY: 'false'
        REQUEST_TIMEOUT: '60000'

  # sentry: deliberate: kept disabled until reviewed
  - id: mcp-sentry
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: sentry
      transport: streamable-http
      url: https://mcp.sentry.dev/mcp

  # solidcraft: opencode entry is [solidcraft-cli, mcp, --allow-any-path]. --allow-any-path lifts the one-DIR limit that silently dropped the second path in the old --allow-path form. cwd is a DSH-side addition, not in opencode.
  - id: mcp-solidcraft
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: solidcraft
      transport: stdio
      command: !!js '`${process.env.HOME}/.local/bin/solidcraft-cli`'
      args: [mcp, '--allow-any-path']
      cwd: !!js '`${process.env.HOME}/Documents/SolidCraft`'
